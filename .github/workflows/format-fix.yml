name: Format Fix

on:
  push:
    branches: ["docs/architecture-bun-mcp"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-bun-mcp

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install

      - name: Apply Biome formatting
        run: bun run format

      - name: Commit generated files
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Biome formatting and lock dependencies"
          git push origin HEAD:docs/architecture-bun-mcp
