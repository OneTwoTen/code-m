name: CI

on:
  push:
    branches: [main, "docs/architecture-bun-mcp"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply formatter for implementation diagnostics
        run: bun run format

      - name: Upload formatted implementation files
        uses: actions/upload-artifact@v4
        with:
          name: issue-4-formatted
          path: |
            apps/mcp-server/src
            tests/e2e
            .env.example
            README.md
            docs

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint.log

      - name: Upload lint log
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck log
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee test.log

      - name: Upload test log
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Build Docker image
        run: docker build --tag codem-mcp:ci .
